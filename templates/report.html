<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="static/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<body class="bg-[#EAEAEA] min-h-screen p-6">

  <!-- Navbar -->

    <nav class="menu">
      <a href="/">Dashboard</a>

  <!-- Main Content -->
  <div class="max-w-6xl mx-auto space-y-6" id="reportContent">
    <div class="text-center py-8">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-4 border-[#AD974F]"></div>
      <p class="text-gray-600 mt-4">Loading report...</p>
    </div>
  </div>

  <script>
    /**
     * Unified data accessor that works with both normalized and legacy formats
     */
    class ReportDataAccessor {
      constructor(data) {
        this.data = data;
        this.isNormalized = !!data.format_type;
      }

      get formatType() {
        const topFormat = this.data.format_type || '';
        if (topFormat && topFormat.toUpperCase() !== 'UNKNOWN') {
          return topFormat.toUpperCase();
        }
        return this._detectLegacyFormat();
      }

      _detectLegacyFormat() {
        const static_analysis = this.data.static_analysis || {};
        if (static_analysis.file_header || static_analysis.dos_header) return 'PE';
        if (static_analysis.elf_header) return 'ELF';
        if (this.data.static_analysis?.shellcode) return 'SHELLCODE';

        const disasm = this.data.disassembly || this.data.static_analysis?.disassembly;
        if (Array.isArray(disasm)) {
          if (disasm.some(ins => String(ins?.annotation || '').toLowerCase().includes('shellcode'))) {
            return 'SHELLCODE';
          }
          if (disasm.length > 0 && !static_analysis.file_header && !static_analysis.elf_header) {
            return 'SHELLCODE';
          }
        }

        return 'UNKNOWN';
      }

      get ingest() {
        return this.data.ingest_analysis || {};
      }

      get staticAnalysis() {
        return this.data.static_analysis || {};
      }

      get hashes() {
        return this.staticAnalysis.hashes || this.data.hash || this.data.extracted?.hashes || {};
      }

      get basicInfo() {
        const static_analysis = this.staticAnalysis;
        const ingest = this.ingest;
        
        const filename = static_analysis.basic_info?.filename || ingest.filename || this.data.file_info?.name;
        const file_size = static_analysis.basic_info?.file_size || ingest.size_bytes || this.data.file_info?.size;

        return {
          filename,
          name: filename,
          file_size,
          size: file_size,
          file_type: static_analysis.basic_info?.file_type || ingest.detected_type || this.data.file_info?.type,
          path: ingest.original_path || this.data.file_info?.path,
          mime_type: ingest.mime_type_guess || this.data.file_info?.mime_type,
          magic: ingest.magic_header_hex || this.data.file_info?.magic,
          extension: ingest.extension || this.data.file_info?.extension,
          timestamp: ingest.ingest_timestamp || this.data.file_info?.timestamp
        };
      }

      get sections() {
        return this.staticAnalysis.sections || [];
      }

      get imports() {
        const static_imports = this.staticAnalysis.imports || [];
        const extracted_imports = this.data.extracted?.imports || [];
        
        // Flatten imports to function names
        const importsList = (static_imports.length ? static_imports : extracted_imports);
        return importsList.flatMap(item => {
          // Normalized format: {library: "...", functions: [...]}
          if (item.library && item.functions) {
            return item.functions.map(fn => fn.name || fn);
          }
          // Legacy PE format: {dll: "...", functions: [...]}
          if (item.dll && item.functions) {
            return item.functions.map(fn => fn.name || fn);
          }
          return [];
        }).filter(Boolean);
      }

      get symbols() {
        return this.staticAnalysis.symbols || [];
      }

      get securityFeatures() {
        return this.staticAnalysis.security_features || {};
      }

      get strings() {
        const strings = this.staticAnalysis.strings;
        if (strings) {
          return strings.suspicious || strings.ascii || strings.unicode || strings.interesting || [];
        }
        return this.data.extracted?.strings || [];
      }

      get shellcode() {
        if (this.staticAnalysis.shellcode) return this.staticAnalysis.shellcode;
        if (this.formatType !== 'SHELLCODE') return null;

        const static_disasm = this.data.static_analysis?.disassembly || [];
        const top_disasm = Array.isArray(this.data.disassembly) ? this.data.disassembly : [];
        const instructions = Array.isArray(top_disasm) && top_disasm.length ? top_disasm : static_disasm;
        const rawhex = instructions.map(ins => (ins.bytes || '').replace(/\s+/g, '')).join('');
        const strlit = instructions.map(ins => ins.ascii_repr || ins.ascii || '').filter(Boolean).join(' ');

        return {
          classification: this.data.ingest_analysis?.detected_type || this.data.ingest_analysis?.claimed_type || 'Shellcode',
          classification_reason: this.data.ingest_analysis?.claimed_type || 'Detected shellcode via disassembly',
          shellcode_hex: {
            rawhex,
            strlit
          },
          deobfuscation: {},
          strings_detailed: { push_stack: [] },
          indicators: {},
          features_detected: []
        };
      }

      get emulation() {
        return this.data.threat_intelligence?.sharem_emulation || null;
      }

      get yaraMatches() {
        let matches = this.staticAnalysis.yara_matches || this.data.extracted?.yara || [];

        // Add from VirusTotal crowdsourced yara results
        const sha = this.hashes.sha256;
        if (sha && this.data.threat_intelligence?.VirusTotal?.[sha]?.crowdsourced_yara_results) {
          const vtYara = this.data.threat_intelligence.VirusTotal[sha].crowdsourced_yara_results;
          // Normalize to the same format
          const normalizedVtYara = vtYara.map(item => ({
            rule_name: item.rule_name,
            description: item.description,
            source: 'VirusTotal'
          }));
          matches = matches.concat(normalizedVtYara);
        }

        return matches;
      }

      get mitreMapping() {
        console.log(this.data)
        return this.data.threat_intelligence?.MITRE_ATTACK?.hits
            || this.data.threat_intelligence?.MITRE_ATTACK
            || {};
      }

      get virusTotal() {
        const sha = this.hashes.sha256;
        let vt = {};

        // helper to unwrap entry if object contains hash keys
        const unwrap = obj => {
          if (!obj || typeof obj !== 'object') return obj;
          if (obj.analysis_stats) return obj;
          if (sha && obj[sha]) return obj[sha];
          // fall back to first value that looks like a vt entry
          for (const val of Object.values(obj)) {
            if (val && typeof val === 'object' && val.analysis_stats) return val;
          }
          return obj;
        };

        // 1. try static_analysis field
        vt = unwrap(this.staticAnalysis.virustotal);
        if (vt && vt.analysis_stats) return vt;

        // 2. legacy extracted field
        vt = unwrap(this.data.extracted?.virustotal);
        if (vt && vt.analysis_stats) return vt;

        // 3. threat_intelligence map
        if (sha && this.data.threat_intelligence?.VirusTotal) {
          vt = unwrap(this.data.threat_intelligence.VirusTotal);
          if (vt && vt.analysis_stats) return vt;
        }

        // nothing useful found
        console.debug('virusTotal lookup failed for hash', sha, 'source data', this.staticAnalysis.virustotal, this.data.extracted?.virustotal, this.data.threat_intelligence);
        return {};
      }

      get functions() {
        // Check in disassembly section (legacy) or in static_analysis (normalized)
        return this.data.disassembly?.functions || this.staticAnalysis.functions || [];
      }

      get functionCount() {
        return this.staticAnalysis.function_count || this.data.disassembly?.function_count || this.functions.length;
      }

      get similarBinaries() {
        return this.staticAnalysis.similar_binaries || this.data.disassembly?.similar_binaries || [];
      }

      get description() {
        return this.data.description?.description || '';
      }

      get formatSpecific() {
        return this.staticAnalysis.format_specific || {};
      }

      get verdict() {
        return this.data.verdict || {};
      }

      get family() {
        return this.data.family || {};
      }

      get dynamicAnalysis() {
        return this.data.dynamic_analysis || null;
      }
    }

    function escapeHTML(value) {
      if (value === null || value === undefined) {
        return '';
      }

      // Convert objects/arrays safely
      let str;

      if (typeof value === 'string') {
        str = value;
      } else if (
        typeof value === 'number' ||
        typeof value === 'boolean'
      ) {
        str = String(value);
      } else {
        try {
          str = JSON.stringify(value, null, 2);
        } catch {
          str = String(value);
        }
      }

      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDisassemblyText(disasm) {
      if (!disasm) return '';
      let funcs = [];
      if (Array.isArray(disasm)) {
        funcs = [{ instructions: disasm }];
      } else {
        funcs = disasm.functions || [];
      }
      if (!funcs.length) return '';

      const fn = funcs[0];
      const instrs = fn.instructions || fn.disassembly || [];
      const lines = [];

      for (const ins of instrs) {
        const off = ins.offset || '';
        const instr = (ins.instruction || '').padEnd(40, ' ');
        const bytes = (ins.bytes || '').padEnd(24, ' ');
        const ascii = ins.ascii_repr || ins.ascii || '';
        lines.push(`${off} ${instr} ${bytes} ${ascii}`);
        if (ins.annotation) {
          lines.push(`     ; ${ins.annotation}`);
        }
        if (ins.call_args && ins.call_args.length) {
          lines.push(`     ; (${ins.call_args.join(', ')})`);
        }
      }

      return lines.join('\n');
    }

    function hideEmptyFields(root = document.getElementById('reportContent')) {
      if (!root) return;

      const elements = Array.from(root.querySelectorAll('*')).reverse();
      for (const el of elements) {
        if (el.id === 'reportFileName') continue;
        if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;

        const hasVisibleChild = Array.from(el.children).some(child => {
          const style = window.getComputedStyle(child);
          return style.display !== 'none' && style.visibility !== 'hidden' && child.offsetParent !== null;
        });

        const ownText = Array.from(el.childNodes).some(node =>
          node.nodeType === Node.TEXT_NODE && node.textContent.trim().length > 0
        );

        if (!hasVisibleChild && !ownText) {
          el.style.display = 'none';
        }
      }
    }

    async function downloadPdfReport(fileName = 'report') {
      const reportContainer = document.getElementById('reportContent');
      if (!reportContainer) return;

      const clone = reportContainer.cloneNode(true);
      const wrapper = document.createElement('div');
      wrapper.style.position = 'fixed';
      wrapper.style.top = '-9999px';
      wrapper.style.left = '-9999px';
      wrapper.style.width = '1200px';
      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);

      const canvas = await html2canvas(clone, {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false
      });

      document.body.removeChild(wrapper);

      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf || {};
      if (!jsPDF) {
        alert('PDF export is unavailable because jsPDF failed to load.');
        return;
      }

      const pdf = new jsPDF('p', 'pt', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      let position = 0;

      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);

      if (imgHeight > pageHeight) {
        let heightLeft = imgHeight - pageHeight;
        while (heightLeft > 0) {
          position -= pageHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }
      }

      pdf.save(`${fileName}.pdf`);
    }

    async function loadReport() {
      const params = new URLSearchParams(window.location.search);
      const hash = params.get("hash");

      if (!hash) {
        document.getElementById("reportContent").innerHTML = `
          <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
            <p class="text-red-600 font-semibold">No hash provided</p>
            <p class="text-gray-500 text-sm mt-2">Please select a file from the dashboard.</p>
            <a href="/" class="inline-block mt-4 btn-primary">Go to Dashboard</a>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch(`/api/report/${hash}`);
        const data = await res.json();

        console.log("Report data:", data);

        if (data.error) {
          document.getElementById("reportContent").innerHTML = `
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
              <p class="text-red-600 font-semibold">${data.error}</p>
              <a href="/" class="inline-block mt-4 btn-primary">Go to Dashboard</a>
            </div>
          `;
          return;
        }

        

        // Use the unified accessor
        const report = new ReportDataAccessor(data);
        
        const formatType = report.formatType;
        const hashes = report.hashes;
        const file_info = report.basicInfo;
        const sections = data.static_analysis?.sections || [];
        const imports = report.imports;
        const symbols = report.symbols;
        const security = report.securityFeatures;
        const strings = report.strings;
        console.log('report.strings:', report.strings);
        const suspicious_strings = data.static_analysis?.strings?.interesting?.file_paths || [];  // this needs to be for all options
        const yara = report.yaraMatches;
        const mitreHits = data.threat_intelligence?.verdict?.hits || data.threat_intelligence?.MITRE_ATTACK?.hits || data.mitre || {};
        console.log('report.threat_intelligence:', data.threat_intelligence?.MITRE_ATTACK?.hits);
        console.log('mitreHits:', mitreHits);
        const capaHits = mitreHits.capa || [];
        console.log('capaHits:', capaHits);
        const vt = report.virusTotal;
        // vt should now be the entry with analysis_stats
        const vt_status = vt.analysis_stats || vt.status || {};
        const allFunctions = data.disassembly?.functions || [];
        const ranked = data.disassembly?.function_scores?.ranked_functions || [];

        // Map ranked by func_hash for fast lookup
        const rankedMap = {};
        ranked.forEach(r => {
          if (r.func_hash) rankedMap[r.func_hash] = r;
        });

        // Merge enrichment into all functions
        const functions = allFunctions.map(f => {
          const enriched = rankedMap[f.func_hash];
          if (enriched) {
            return { ...f, ...enriched, is_suspicious: true };
          }
          return { ...f, is_suspicious: false };
        });
        const similarityList = data.disassembly?.similarity?.function_similarity || [];
        // Build func_hash -> shared matches
        const sharedMap = {};

        similarityList.forEach(sim => {
          const shared = sim.shared_functions || [];

          shared.forEach(sf => {
            const h = sf.func_hash;
            if (!h) return;

            if (!sharedMap[h]) sharedMap[h] = [];

            sharedMap[h].push({
              binary_id: sim.binary_id,
              similarity_score: sim.similarity_score,
              overlap_pct_of_smaller: sim.overlap_pct_of_smaller,
              shared_count: sim.shared_count,

              name_in_match: sf.name_in_match,
              offset_in_match: sf.offset_in_match,
              name_in_new: sf.name_in_new,
              offset_in_new: sf.offset_in_new,

              // optional fields if you add later
              matched_strings: sf.strings_referenced || [],
              matched_techniques: sf.techniques || []
            });
          });
        });

        // Attach to each function
        functions.forEach(f => {
          f.corpus_matches = sharedMap[f.func_hash] || [];
        });
        const similar_binaries = report.similarBinaries;
        const description = (report.description || '').trim();
        const verdict = report.verdict;
        const family = report.family;
        const dynamic = report.dynamicAnalysis;
        const packing = report.staticAnalysis.packing || {};

        // Build format-specific sections
        let formatSpecificSection = '';
        const formatSpecific = report.formatSpecific;
        
        if (formatType === 'PE' && Object.keys(formatSpecific).length > 0) {
          formatSpecificSection = buildPESpecificSection(formatSpecific);
        } else if (formatType === 'ELF' && Object.keys(formatSpecific).length > 0) {
          formatSpecificSection = buildELFSpecificSection(formatSpecific);
        } else if (formatType === 'SHELLCODE') {
          formatSpecificSection = buildShellcodeSection(report.shellcode, report.emulation, data);
        }

        if (Array.isArray(capaHits) && capaHits.length > 0) {
          capaHits.forEach(hit => {
            console.log(`Technique: ${hit.technique}, Tactic: ${hit.tactic}, Rule: ${hit.rule}, Confidence: ${hit.confidence}`);
          });
        } else {
          console.log("No CAPA hits found");
        }

        document.getElementById("reportContent").innerHTML = `
          <!-- File Overview -->
          <div class="mb-4 flex flex-wrap gap-2">
            <span class="inline-block px-3 py-1 rounded-full text-sm font-semibold ${
              formatType === 'PE' ? 'bg-blue-100 text-blue-800' :
              formatType === 'ELF' ? 'bg-green-100 text-green-800' :
              formatType === 'OLE' ? 'bg-purple-100 text-purple-800' :
              formatType === 'SHELLCODE' ? 'bg-red-100 text-red-800' :
              'bg-gray-100 text-gray-800'
            }">
              ${formatType} File
            </span>

            ${verdict.verdict ? `
            <span class="inline-block px-3 py-1 rounded-full text-sm font-semibold ${
              verdict.verdict.toLowerCase() === 'malicious' ? 'bg-red-100 text-red-800' :
              verdict.verdict.toLowerCase() === 'benign' ? 'bg-green-100 text-green-800' :
              'bg-yellow-100 text-yellow-800'
            }">
              ${verdict.verdict}
            </span>
            ` : ''}

            ${family.identified_family ? `
            <span class="inline-block px-3 py-1 rounded-full text-sm font-semibold bg-purple-100 text-purple-800">
              Family: ${family.identified_family}
            </span>
            ` : ''}

            ${report.staticAnalysis?.packing?.verdict ? `
            <span class="inline-block px-3 py-1 rounded-full text-sm font-semibold ${
              report.staticAnalysis.packing.verdict.toLowerCase().includes("packed")
                ? 'bg-red-100 text-red-800'
                : 'bg-green-100 text-green-800'
            }">
              Packing: ${report.staticAnalysis.packing.verdict}
              ${report.staticAnalysis.packing.confidence != null
                ? ` (${Math.round(report.staticAnalysis.packing.confidence * 100)}%)`
                : ''
              }
            </span>
            ` : ''}
          </div>

           <!-- File Overview -->
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <!-- Hidden filename for client-side download button -->
            <span id="reportFileName" style="display:none">${file_info.filename || file_info.name || 'here'}</span>
            <h1 class="text-2xl font-bold text-[#231F20] mb-6">File Analysis Report</h1>
            <div class="grid grid-cols-1 md:grid-cols-1 gap-6 text-sm">
              <div class="space-y-2">
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">MD5:</span>
                  <span class="text-gray-600 font-mono text-xs">${hashes.md5 || "Unknown"}</span>
                </p>
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">SHA1:</span>
                  <span class="text-gray-600 font-mono text-xs">${hashes.sha1 || "Unknown"}</span>
                </p>
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">SHA256:</span>
                  <span class="text-gray-600 font-mono text-xs break-all">${hashes.sha256 || "Unknown"}</span>
                </p>
                ${file_info.size ? `
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">File Size:</span>
                  <span class="text-gray-600">${formatBytes(file_info.size)}</span>
                </p>
                ` : file_info.file_size ? `
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">File Size:</span>
                  <span class="text-gray-600">${formatBytes(file_info.file_size)}</span>
                </p>
                ` : ''}
              </div>
            </div>
          </div>

          <!-- Similar Files -->
          ${Array.isArray(similarityList) && similarityList.length > 0 ? `
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">
              Similar Files Found (${similarityList.length})
            </h2>

            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-4 py-2 text-left">File</th>
                    <th class="px-4 py-2 text-left">SHA256</th>
                    <th class="px-4 py-2 text-left">Similarity</th>
                  </tr>
                </thead>
                <tbody class="font-mono text-xs">
                  ${similarityList.map(s => {
                    const simPct = (s.similarity_score != null)
                      ? (s.similarity_score * 100).toFixed(1)
                      : "N/A";

                    const shaFromBinaryId = (s.binary_id && s.binary_id.includes("."))
                      ? s.binary_id.split(".")[0]
                      : (s.binary_id || null);

                    return `
                      <tr class="border-t border-gray-200 hover:bg-gray-50">
                        <td class="px-4 py-2 text-gray-700 font-semibold">
                          ${escapeHTML(s.filename || s.file_name || s.binary_id || "Unknown")}

                          ${shaFromBinaryId ? `
                            <a href="/report?hash=${encodeURIComponent(shaFromBinaryId)}"
                              class="block text-xs text-[#AD974F] hover:text-[#8E793E] mt-1">
                              View Report →
                            </a>
                          ` : ''}
                        </td>

                        <td class="px-4 py-2 text-gray-600 break-all">
                          ${escapeHTML(shaFromBinaryId || "N/A")}
                        </td>

                        <td class="px-4 py-2">
                          <span class="px-2 py-1 rounded text-xs font-bold bg-blue-100 text-blue-800">
                            ${simPct}%
                          </span>
                        </td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
          ` : ''}

          <!-- Security Features -->
          ${Object.keys(security).length && formatType !== 'SHELLCODE' ? `
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">Security Features</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              ${Object.entries(security).map(([key, value]) => `
                <div class="flex items-center space-x-2 ${value ? 'text-green-600' : 'text-red-600'}">
                  <span class="text-lg">${value ? '✓' : '✗'}</span>
                  <span class="font-semibold">${key}</span>
                </div>
              `).join("")}
            </div>
          </div>
          ` : ''}

          <!-- Sections -->
          ${sections.length ? `
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">Sections (${sections.length})</h2>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="px-4 py-2 text-left">Name</th>
                    <th class="px-4 py-2 text-left">Virtual Address</th>
                    <th class="px-4 py-2 text-left">Size</th>
                    <th class="px-4 py-2 text-left">Entropy</th>
                    <th class="px-4 py-2 text-left">Permissions</th>
                    <th class="px-4 py-2 text-left">SHA256 Hash</th>
                  </tr>

      // REPORT SEARCH + FILTER FUNCTION

      (function injectReportSearch() {
        const container = document.getElementById("reportContent");
        if (!container) return;

        // Avoid duplicate injection
        if (document.getElementById("reportSearchInput")) return;

        const searchWrapper = document.createElement("div");
        searchWrapper.className = "bg-white rounded-2xl shadow-lg p-6";

        searchWrapper.innerHTML = `
          <h2 class="text-lg font-bold text-[#8E793E] mb-3">Search Report</h2>

          <div class="flex flex-col md:flex-row gap-3 items-center">
            <input 
              id="reportSearchInput"
              type="text"
              placeholder="Search functions, strings, imports, MITRE techniques, hashes..."
              class="w-full md:flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#AD974F]"
            />

            <button 
              id="reportSearchClear"
              class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-semibold"
            >
              Clear
            </button>

            <span id="reportSearchCount" class="text-sm text-gray-600 font-semibold">
              Showing all sections
            </span>
          </div>
        `;

        // Insert at top of report
        container.prepend(searchWrapper);

        const input = document.getElementById("reportSearchInput");
        const clearBtn = document.getElementById("reportSearchClear");
        const countLabel = document.getElementById("reportSearchCount");

        const allCards = Array.from(container.children).filter(el => el !== searchWrapper);

        function normalizeText(str) {
          return (str || "").toLowerCase().trim();
        }

        function openDetailsContainingMatch(card, query) {
          const detailsBlocks = card.querySelectorAll("details");
          detailsBlocks.forEach(d => {
            const text = normalizeText(d.innerText);
            d.open = text.includes(query);
          });
        }

        function filterReport(queryRaw) {
          const query = normalizeText(queryRaw);

          if (!query) {
            allCards.forEach(card => {
              card.style.display = "";
              card.querySelectorAll("details").forEach(d => d.open = false);
            });
            countLabel.textContent = "Showing all sections";
            return;
          }

          let visibleCount = 0;

          allCards.forEach(card => {
            const text = normalizeText(card.innerText);

            if (text.includes(query)) {
              card.style.display = "";
              visibleCount++;
              openDetailsContainingMatch(card, query);
            } else {
              card.style.display = "none";
            }
          });

          countLabel.textContent = `Showing ${visibleCount}/${allCards.length} sections`;
        }

        input.addEventListener("input", () => {
          filterReport(input.value);
        });

        clearBtn.addEventListener("click", () => {
          input.value = "";
          filterReport("");
          input.focus();
        });
      })();
    }

    }

    function buildPESpecificSection(formatSpecific) {
      const dosHeader = formatSpecific.dos_header || {};
      const fileHeader = formatSpecific.file_header || {};
      const optionalHeader = formatSpecific.optional_header || {};

      return `
        <div class="bg-white rounded-2xl shadow-lg p-6">
          <h2 class="text-xl font-bold text-[#8E793E] mb-4">PE-Specific Details</h2>
          
          ${Object.keys(fileHeader).length ? `
          <div class="mb-4">
            <h3 class="font-semibold text-gray-700 mb-2">File Header</h3>
            <div class="bg-gray-50 rounded p-3 text-sm space-y-1">
              <p><span class="font-mono text-gray-600">Machine:</span> ${fileHeader.Machine?.decoded || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Number of Sections:</span> ${fileHeader.NumberOfSections || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Time Date Stamp:</span> ${fileHeader.TimeDateStamp?.readable || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Characteristics:</span> ${fileHeader.Characteristics?.flags?.join(', ') || 'N/A'}</p>
            </div>
          </div>
          ` : ''}

          ${Object.keys(optionalHeader).length ? `
          <div class="mb-4">
            <h3 class="font-semibold text-gray-700 mb-2">Optional Header</h3>
            <div class="bg-gray-50 rounded p-3 text-sm space-y-1">
              <p><span class="font-mono text-gray-600">Magic:</span> ${optionalHeader.Magic?.decoded || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Subsystem:</span> ${optionalHeader.Subsystem?.decoded || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Entry Point:</span> ${optionalHeader.AddressOfEntryPoint || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Image Base:</span> ${optionalHeader.ImageBase || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">DLL Characteristics:</span> ${optionalHeader.DllCharacteristics?.flags?.join(', ') || 'N/A'}</p>
            </div>
          </div>
          ` : ''}
        </div>
      `;
    }

    function buildELFSpecificSection(formatSpecific) {
      const elfHeader = formatSpecific.elf_header || {};
      const programHeaders = formatSpecific.program_headers || [];
      const dynamic = formatSpecific.dynamic || [];

      return `
        <div class="bg-white rounded-2xl shadow-lg p-6">
          <h2 class="text-xl font-bold text-[#8E793E] mb-4">ELF-Specific Details</h2>
          
          ${Object.keys(elfHeader).length ? `
          <div class="mb-4">
            <h3 class="font-semibold text-gray-700 mb-2">ELF Header</h3>
            <div class="bg-gray-50 rounded p-3 text-sm space-y-1">
              <p><span class="font-mono text-gray-600">Class:</span> ${elfHeader.e_ident?.EI_CLASS || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Data:</span> ${elfHeader.e_ident?.EI_DATA || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Type:</span> ${elfHeader.e_type || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Machine:</span> ${elfHeader.e_machine || 'N/A'}</p>
              <p><span class="font-mono text-gray-600">Entry Point:</span> 0x${(elfHeader.e_entry || 0).toString(16)}</p>
            </div>
          </div>
          ` : ''}

          ${programHeaders.length ? `
          <div class="mb-4">
            <h3 class="font-semibold text-gray-700 mb-2">Program Headers (${programHeaders.length})</h3>
            <details>
              <summary class="cursor-pointer text-sm font-semibold text-[#AD974F] hover:text-[#8E793E]">
                View Program Headers
              </summary>
              <div class="mt-2 overflow-x-auto">
                <table class="w-full text-xs">
                  <thead class="bg-gray-100">
                    <tr class="text-left">
                      <th class="p-2">Type</th>
                      <th class="p-2">Flags</th>
                      <th class="p-2">Virtual Address</th>
                      <th class="p-2">File Size</th>
                      <th class="p-2">Memory Size</th>
                    </tr>
                  </thead>
                  <tbody class="font-mono">
                    ${programHeaders.map(ph => `
                      <tr class="border-t border-gray-200">
                        <td class="p-2">${ph.p_type || 'N/A'}</td>
                        <td class="p-2">${ph.p_flags || 'N/A'}</td>
                        <td class="p-2">0x${(ph.p_vaddr || 0).toString(16)}</td>
                        <td class="p-2">${ph.p_filesz || 0}</td>
                        <td class="p-2">${ph.p_memsz || 0}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </details>
          </div>
          ` : ''}

          ${formatSpecific.interpreter ? `
          <div class="mb-4">
            <h3 class="font-semibold text-gray-700 mb-2">Interpreter</h3>
            <div class="bg-gray-50 rounded p-3 text-sm font-mono">
              ${formatSpecific.interpreter}
            </div>
          </div>
          ` : ''}
        </div>
      `;
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    loadReport();
  </script>
</body>
</html>
