<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Analysis Report - INFLEX</title>
  <link rel="stylesheet" href="static/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EAEAEA] min-h-screen p-6">

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">INFLEX</div>
    <nav class="menu">
      <a href="/">Dashboard</a>
      <a href="/uploads">Uploads</a>
      <a href="/search">Reports</a>
      <a href="/graph">Graphs</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>

  <!-- Main Content -->
  <div class="max-w-6xl mx-auto space-y-6" id="reportContent">
    <div class="text-center py-8">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-4 border-[#AD974F]"></div>
      <p class="text-gray-600 mt-4">Loading report...</p>
    </div>
  </div>

  <script>
    async function loadReport() {
      const params = new URLSearchParams(window.location.search);
      const hash = params.get("hash");

      if (!hash) {
        document.getElementById("reportContent").innerHTML = `
          <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
            <p class="text-red-600 font-semibold">No hash provided</p>
            <p class="text-gray-500 text-sm mt-2">Please select a file from the dashboard.</p>
            <a href="/" class="inline-block mt-4 btn-primary">Go to Dashboard</a>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch(`/api/report/${hash}`);
        const data = await res.json();

        console.log("Report data:", data);

        if (data.error) {
          document.getElementById("reportContent").innerHTML = `
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
              <p class="text-red-600 font-semibold">${data.error}</p>
              <a href="/" class="inline-block mt-4 btn-primary">Go to Dashboard</a>
            </div>
          `;
          return;
        }

        // Extract data from new integrated format
        const ingest = data.ingest_analysis || {};
        const static_analysis = data.static_analysis || {};
        const disassembly = data.disassembly || {};

        // Support both new integrated format and legacy format
        const hashes = static_analysis.hashes || data.hash || data.extracted?.hashes || {};
        const file_info = {
          name: ingest.filename || data.file_info?.name,
          path: ingest.original_path || data.file_info?.path,
          size: static_analysis.basic_info?.file_size || ingest.size_bytes || data.file_info?.size,
          type: ingest.detected_type || data.file_info?.type,
          mime_type: ingest.mime_type_guess || data.file_info?.mime_type,
          magic: ingest.magic_header_hex || data.file_info?.magic,
          extension: ingest.extension || data.file_info?.extension,
          timestamp: ingest.ingest_timestamp || data.file_info?.timestamp
        };

        const pe_structure = {
          machine: static_analysis.file_header?.Machine?.decoded,
          subsystem: static_analysis.optional_header?.Subsystem?.decoded,
          sections: static_analysis.sections || [],
          imports: static_analysis.imports || [],
          security_features: static_analysis.security_features || {},
          dos_header: static_analysis.dos_header || {},
          file_header: static_analysis.file_header || {},
          optional_header: static_analysis.optional_header || {}
        };

        // Legacy fields for backwards compatibility
        const extracted = data.extracted || {};
        const mitre = data.mitre || {};
        const description = data.description || {};

        // Import data - flatten the functions from each DLL
        // const imports = (pe_structure.imports || []).flatMap(dll =>
        //   (dll.functions || []).map(fn => fn.name || fn)
        // );
        // Try all possible locations for imports
      let imports = [];
      if (Array.isArray(data.static_analysis?.imports)) {
        imports = data.static_analysis.imports.flatMap(dll =>
          (Array.isArray(dll.functions) ? dll.functions : []).map(fn => fn.name || fn)
        );
      } else if (Array.isArray(data.extracted?.imports)) {
        imports = data.extracted.imports.flatMap(dll =>
          (Array.isArray(dll.functions) ? dll.functions : []).map(fn => fn.name || fn)
        );
      } else {
        console.debug("No imports found in static_analysis or extracted", { data });
      }

        // Static analysis fields
        const yara = static_analysis.yara_matches || extracted.yara || [];
        const strings = static_analysis.strings?.suspicious || static_analysis.strings?.ascii || static_analysis.strings?.unicode || extracted.strings || [];
        const vt = static_analysis.virustotal || extracted.virustotal || {};
        const vt_status = vt.status || {};

        // MITRE mapping
        const mitre_map = static_analysis.mitre_mapping || mitre.mapping || {};

        // Disassembly data
        const functions = disassembly.functions || [];
        const similar_binaries = disassembly.similar_binaries || [];

        document.getElementById("reportContent").innerHTML = `
          <!-- File Overview -->
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <!-- Hidden filename for client-side download button -->
            <span id="reportFileName" style="display:none">${file_info.name || 'here'}</span>
            <h1 class="text-2xl font-bold text-[#231F20] mb-6">File Analysis Report</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
              <div class="space-y-2">
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">MD5:</span>
                  <span class="text-gray-600 font-mono text-xs">${hashes.md5 || "Unknown"}</span>
                </p>
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">SHA1:</span>
                  <span class="text-gray-600 font-mono text-xs">${hashes.sha1 || "Unknown"}</span>
                </p>
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">SHA256:</span>
                  <span class="text-gray-600 font-mono text-xs break-all">${hashes.sha256 || "Unknown"}</span>
                </p>
                ${file_info.size ? `
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">File Size:</span>
                  <span class="text-gray-600">${formatBytes(file_info.size)}</span>
                </p>
                ` : ''}
              </div>
              <div class="space-y-2">
                <p>
                  <span class="font-bold text-gray-700">VirusTotal:</span>
                  ${vt.permalink
                    ? `<a href="${vt.permalink}" target="_blank" class="text-[#AD974F] hover:text-[#8E793E] ml-2">View Report →</a>`
                    : '<span class="text-gray-500 ml-2">Unknown</span>'}
                </p>
                <p>
                  <span class="font-bold text-gray-700">Detections:</span>
                  <span class="ml-2">
                    <span class="font-bold text-red-600">${vt_status.malicious || 0}</span> malicious /
                    <span class="text-gray-600">${vt_status.undetected || 0}</span> undetected
                  </span>
                </p>
                ${pe_structure.machine ? `
                <p class="flex justify-between">
                  <span class="font-bold text-gray-700">Architecture:</span>
                  <span class="text-gray-600">${pe_structure.machine}</span>
                </p>
                ` : ''}
              </div>
            </div>
          </div>

          <!-- Similar Binaries (NEW) -->
          ${similar_binaries.length ? `
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">⚠️ Similar Binaries Detected</h2>
            <p class="text-sm text-gray-600 mb-4">This binary shares significant code similarity with the following files:</p>
            <div class="space-y-3">
              ${similar_binaries.map(sim => `
                <div class="border-l-4 border-red-500 bg-red-50 pl-4 py-3 rounded">
                  <div class="flex justify-between items-center">
                    <div>
                      <p class="font-mono text-xs text-gray-700 break-all">${sim.sha256}</p>
                      <p class="text-xs text-gray-500 mt-1">${sim.file_path || 'Unknown path'}</p>
                    </div>
                    <div class="text-right ml-4">
                      <span class="inline-block px-3 py-1 bg-red-600 text-white rounded-full text-xs font-bold">
                        ${(sim.similarity * 100).toFixed(1)}% Match
                      </span>
                      <a href="/report?hash=${sim.sha256}" class="block text-xs text-[#AD974F] hover:text-[#8E793E] mt-1">
                        View Report →
                      </a>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
          ` : ''}

          <!-- Disassembly Statistics (NEW) -->
          ${functions.length ? `
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">Disassembly Analysis</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div class="bg-gray-50 rounded-lg p-4 text-center">
                <p class="text-3xl font-bold text-[#AD974F]">${functions.length}</p>
                <p class="text-sm text-gray-600 mt-1">Functions Analyzed</p>
              </div>
              <div class="bg-gray-50 rounded-lg p-4 text-center">
                <p class="text-3xl font-bold text-[#AD974F]">${functions.reduce((sum, f) => sum + (f.size || 0), 0)}</p>
                <p class="text-sm text-gray-600 mt-1">Total Bytes</p>
              </div>
              <div class="bg-gray-50 rounded-lg p-4 text-center">
                <p class="text-3xl font-bold text-[#AD974F]">${Math.round(functions.reduce((sum, f) => sum + (f.size || 0), 0) / functions.length)}</p>
                <p class="text-sm text-gray-600 mt-1">Avg Function Size</p>
              </div>
              <div class="bg-gray-50 rounded-lg p-4 text-center">
                <p class="text-3xl font-bold text-[#AD974F]">${similar_binaries.length}</p>
                <p class="text-sm text-gray-600 mt-1">Similar Files</p>
              </div>
            </div>
            <details class="mt-4">
              <summary class="cursor-pointer text-sm font-semibold text-[#AD974F] hover:text-[#8E793E]">
                View Function List (${functions.length} functions)
              </summary>
              <div class="mt-3 max-h-96 overflow-y-auto bg-gray-50 rounded p-3">
                <table class="w-full text-xs">
                  <thead class="sticky top-0 bg-gray-100">
                    <tr class="text-left">
                      <th class="p-2">Function Name</th>
                      <th class="p-2">Offset</th>
                      <th class="p-2">Size</th>
                      <th class="p-2">Hash</th>
                    </tr>
                  </thead>
                  <tbody class="font-mono">
                    ${functions.map(f => `
                      <tr class="border-t border-gray-200 hover:bg-gray-100">
                        <td class="p-2">${f.name}</td>
                        <td class="p-2 text-gray-600">${f.offset}</td>
                        <td class="p-2 text-gray-600">${f.size} bytes</td>
                        <td class="p-2 text-gray-500 truncate max-w-xs">${f.func_hash}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </details>
          </div>
          ` : ''}

          <!-- LLM Description -->
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">AI Analysis</h2>
            <div class="bg-gray-50 rounded-lg p-4">
              <p class="text-gray-700 leading-relaxed">
                ${description.description || "No AI analysis available for this file."}
              </p>
            </div>
          </div>

          <!-- Imported Functions -->
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">Imported Functions</h2>
            ${imports.length
              ? `<div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                   ${imports.map(fn =>
                     `<span class="px-3 py-2 bg-gray-100 rounded text-sm font-mono text-gray-700">${fn}</span>`
                   ).join("")}
                 </div>`
              : '<p class="text-gray-500">No imported functions detected.</p>'}
          </div>

          <!-- Suspicious Strings -->
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">Suspicious Strings</h2>
            ${strings.length
              ? `<pre class="bg-gray-100 p-4 rounded text-sm overflow-x-auto font-mono text-gray-700">${strings.join("\n")}</pre>`
              : '<p class="text-gray-500">No suspicious strings detected.</p>'}
          </div>

          <!-- YARA Matches -->
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">YARA Matches</h2>
            ${Array.isArray(yara) && yara.length
              ? `<ul class="list-disc ml-6 space-y-1 text-gray-700">
                   ${yara.map(y => `<li>${y}</li>`).join("")}
                 </ul>`
              : '<p class="text-gray-500">No YARA rules matched.</p>'}
          </div>

          <!-- MITRE ATT&CK -->
          <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-[#8E793E] mb-4">MITRE ATT&CK Techniques</h2>
            ${Object.values(mitre_map).length
              ? `<ul class="space-y-3">
                   ${Object.values(mitre_map).map(t => `
                     <li class="border-l-4 border-[#AD974F] pl-4 py-2">
                       <div class="font-bold text-[#231F20]">${t.technique_id}: ${t.name}</div>
                       <div class="text-sm text-gray-600 mt-1">${t.description}</div>
                     </li>
                   `).join("")}
                 </ul>`
              : '<p class="text-gray-500">No MITRE ATT&CK techniques identified.</p>'}
          </div>
        `;
        // After rendering the report HTML, create the download button.
        // Use several fallbacks to find the filename (some reports use `ingest_analysis`, others `file_info`).
        const fname = (ingest && ingest.filename) || (file_info && file_info.name) || (static_analysis && static_analysis.basic_info && static_analysis.basic_info.filename) || null;

        if (fname) {
          const downloadUrl = `/download/${encodeURIComponent(fname)}`;

          const btn = document.createElement('button');
          btn.textContent = 'Download File';
          btn.className = 'inline-block mt-4 btn-primary';
          btn.addEventListener('click', () => { window.location.href = downloadUrl; });

          const overview = document.getElementById('reportContent').querySelector('.bg-white');
          if (overview) {
            const wrapper = document.createElement('div');
            wrapper.className = 'mt-4';
            wrapper.appendChild(btn);
            overview.appendChild(wrapper);
          }
        } else {
          console.debug('Download button not created: no filename found in report', { ingest, file_info, static_analysis, hashes });
        }
      } catch (err) {
        document.getElementById("reportContent").innerHTML = `
          <div class="bg-white rounded-2xl shadow-lg p-6 text-center">
            <p class="text-red-600 font-semibold">Error loading report</p>
            <p class="text-gray-500 text-sm mt-2">Please try again or contact support.</p>
            <a href="/" class="inline-block mt-4 btn-primary">Go to Dashboard</a>
          </div>
        `;
        console.error(err);
      }
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }


    loadReport();
  </script>
</body>
</html>
