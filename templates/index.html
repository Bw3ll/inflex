<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - INFLEX</title>
  <link rel="stylesheet" href="static/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#EAEAEA] min-h-screen p-6">

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">INFLEX</div>
    <nav class="menu">
      <a href="/">Dashboard</a>
      <a href="/uploads">Uploads</a>
      <a href="/search">Reports</a>
      <a href="/graph">Graphs</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>

  <!-- Main Content -->
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold text-[#231F20] mb-4">Results Dashboard</h1>

    <!-- Charts Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div class="bg-white rounded-2xl shadow-lg p-6">
        <h2 class="font-bold text-lg mb-4 text-[#8E793E]">Result Distribution</h2>
        <canvas id="pieChart"></canvas>
      </div>
      <div class="bg-white rounded-2xl shadow-lg p-6">
        <h2 class="font-bold text-lg mb-4 text-[#8E793E]">Results by Category</h2>
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <!-- Files List -->
    <div class="bg-white rounded-2xl shadow-lg p-6">
      <h2 class="font-bold text-lg mb-4 text-[#8E793E]">Files</h2>
      <ul id="fileList" class="divide-y divide-gray-200"></ul>
    </div>
  </div>

  <script>
    async function loadAndRender() {
      try {
        const res = await fetch("/api/results");
        const items = await res.json();

        const categoryCounts = { "Suspected": 0, "Clean": 0, "Error": 0 };
        // Errors will come from checking if all the required fields are present or not
        const fileList = document.getElementById("fileList");
        fileList.innerHTML = "";

        const REQUIRED_TOP_LEVEL_KEYS = [
          "ingest_analysis",
          "static_analysis",
          "analysis_timestamps"
        ];

        items.forEach(it => {
          const extracted = it.extracted || it;

          // -------------------------------
          // Top-level schema validation
          // -------------------------------
          const missingKeys = REQUIRED_TOP_LEVEL_KEYS.filter(
            key => !(key in extracted)
          );

          const hasSchemaError = missingKeys.length > 0;

          // -------------------------------
          // Hash + VT logic (only if valid)
          // -------------------------------
          // const sha = extracted.ingest_analysis?.sha256;
          const sha = "275a021bbfb6489e54d471899f7db9d1663fc695ec2fe2a2c4538aabf651fd0f"; // test VT hash
          const vt = extracted.threat_intel?.VirusTotal || {};

          let severity;

          if (hasSchemaError) {
            severity = "Error";
          } else {
            const malicious =
              sha && vt[sha]?.analysis_stats?.malicious
                ? vt[sha].analysis_stats.malicious
                : 0;

            console.log("Malicious count for", sha, "is", malicious);
            severity = malicious > 0 ? "Suspected" : "Clean";
          }

          // -------------------------------
          // Category counting
          // -------------------------------
          categoryCounts[severity] = (categoryCounts[severity] || 0) + 1;

          // -------------------------------
          // UI rendering
          // -------------------------------
          const li = document.createElement("li");
          li.className =
            "py-3 px-2 flex justify-between items-center hover:bg-gray-50";

          const left = document.createElement("div");
          left.innerHTML = `
            <div class="font-semibold text-[#231F20]">
              ${extracted.ingest_analysis?.original_path || "unknown"}
            </div>
            <div class="text-sm ${
              severity === "Error" ? "text-red-600" : "text-gray-600"
            }">
              ${
                severity === "Error"
                  ? `Schema error – missing: ${missingKeys.join(", ")}`
                  : extracted.ingest_analysis?.sha256 || "no hash"
              }
            </div>
          `;

          const right = document.createElement("div");

          if (severity !== "Error") {
            right.innerHTML = `
              <a href="/report?hash=${extracted.ingest_analysis?.sha256}"
                class="px-4 py-2 rounded bg-[#AD974F] text-white hover:bg-[#8E793E] transition-colors inline-block">
                View Report
              </a>
            `;
          } else {
            right.innerHTML = `
              <span class="px-4 py-2 rounded bg-red-100 text-red-700 text-sm">
                Invalid Sample
              </span>
            `;
          }

          li.appendChild(left);
          li.appendChild(right);
          fileList.appendChild(li);
        });


        // Build charts
        const pieLabels = Object.keys(categoryCounts);
        const pieData = Object.values(categoryCounts);

        // Pie Chart
        const pieCtx = document.getElementById("pieChart").getContext("2d");
        new Chart(pieCtx, {
          type: 'pie',
          data: {
            labels: pieLabels,
            datasets: [{
              data: pieData,
              backgroundColor: ['#AD974F', '#8E793E', '#231F20']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true
          }
        });

        // Bar Chart
        const barCtx = document.getElementById("barChart").getContext("2d");
        new Chart(barCtx, {
          type: 'bar',
          data: {
            labels: pieLabels,
            datasets: [{
              label: 'Count',
              data: pieData,
              backgroundColor: ['#AD974F', '#8E793E', '#231F20']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });
      } catch (err) {
        console.error("Error loading dashboard data:", err);
      }
    }

    loadAndRender();
  </script>
</body>
</html>
